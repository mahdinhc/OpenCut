name: Android build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Install Android SDK/NDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Prepare signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "OPENCUT_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "OPENCUT_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "OPENCUT_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "OPENCUT_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No release keystore configured - release APK will be signed with the debug key."
          fi
          echo "OPENCUT_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Build debug APK
        if: github.event_name != 'pull_request'
        working-directory: android
        run: gradle assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/OpenCut-release.apk
          cp android/app/build/outputs/apk/debug/*.apk dist/OpenCut-debug.apk 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCut-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenCut-release.apk
          generate_release_notes: true
