pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
// Look the extension up by name so no class reference has to resolve at script-compile time.
extensions.configure("reactSettings") { ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'OpenCut'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
