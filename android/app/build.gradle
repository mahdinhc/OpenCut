apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

project.ext.vectoricons = [iconFontNames: ['MaterialCommunityIcons.ttf']]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

react {
    autolinkLibrariesWithApp()
}

def jscFlavor = 'org.webkit:android-jsc:+'
def media3 = "1.5.1"
def hasKeystore = System.getenv("OPENCUT_KEYSTORE_FILE") != null

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.opencut"

    defaultConfig {
        applicationId "com.opencut"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (System.getenv("OPENCUT_VERSION_CODE") ?: "1").toInteger()
        versionName (System.getenv("OPENCUT_VERSION_NAME") ?: "0.1.0")
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(System.getenv("OPENCUT_KEYSTORE_FILE"))
                storePassword System.getenv("OPENCUT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("OPENCUT_KEY_ALIAS")
                keyPassword System.getenv("OPENCUT_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            // Falls back to the debug key when no release keystore is provided (CI test builds).
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        jniLibs { pickFirsts += ["**/libc++_shared.so"] }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.media3:media3-common:$media3")
    implementation("androidx.media3:media3-exoplayer:$media3")
    implementation("androidx.media3:media3-ui:$media3")
    implementation("androidx.media3:media3-effect:$media3")
    implementation("androidx.media3:media3-transformer:$media3")
    if (project.findProperty("hermesEnabled")?.toString() == "true") {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
